name: Build Realme GT 2 Pro GKI 5.10 LTS Kernel

on:
  push:
    branches:
      - oneplus/sm8450_5.10_lts
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'KernelSU variant (official = tiann/KernelSU, next = KernelSU-Next, none = stock)'
        required: true
        default: 'official'
        type: choice
        options:
          - official
          - next
          - none
      ksu_ref:
        description: 'Optional KernelSU tag/branch/commit (defaults to 2a60b28 with SUSFS, or latest tag without SUSFS)'
        required: false
        default: ''
        type: string
      enable_susfs:
        description: 'Enable SUSFS v2.4.0 root hiding patches (requires ksu_variant=official)'
        required: false
        default: true
        type: boolean
      susfs_ref:
        description: 'Commit/ref in simonpunk/susfs4ksu (branch gki-android12-5.10)'
        required: false
        default: '784ac9e6'
        type: string
      lto:
        description: 'Clang LTO mode (full matches stock GKI boot.img)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - thin
          - none
      kernel_suffix:
        description: 'Optional suffix appended after -android12-9-o-g<sha> (e.g. -custom)'
        required: false
        default: ''
        type: string
      build_image_lz4:
        description: 'Also build and upload Image.lz4'
        required: false
        default: false
        type: boolean
      create_release:
        description: 'Publish flashable AnyKernel3 ZIP as a GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build GKI 5.10 LTS Kernel & Package AnyKernel3
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space & add swap for FullLTO
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /swapfile_extra
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            kmod \
            libelf-dev \
            libncurses5 \
            libssl-dev \
            libtinfo5 \
            lz4 \
            python3 \
            python-is-python3 \
            tar \
            unzip \
            xz-utils \
            zip \
            zstd

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel_platform/common
          fetch-depth: 1

      - name: Fetch companion OnePlus/Oplus SM8450 modules & vendor source
        run: |
          git clone --depth=1 --single-branch \
            --branch oneplus/sm8450_b_16.0_oneplus_10_pro \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8450.git \
            vendor-source-tmp
          mv vendor-source-tmp/vendor "${GITHUB_WORKSPACE}/vendor"
          mv vendor-source-tmp/kernel_platform/oplus "${GITHUB_WORKSPACE}/kernel_platform/oplus"
          rm -rf vendor-source-tmp
          test -f "${GITHUB_WORKSPACE}/kernel_platform/common/drivers/soc/oplus/storage/Kconfig"
          test -f "${GITHUB_WORKSPACE}/kernel_platform/common/kernel/oplus_cpu/sched/Kconfig"

      - name: Cache AOSP Clang r416183b
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchain/clang
          key: aosp-clang-r416183b-linux-x86

      - name: Download AOSP Clang r416183b
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain/clang
          curl -fsSL \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz" \
            | tar -xz -C toolchain/clang

      - name: Verify toolchain
        run: |
          "${GITHUB_WORKSPACE}/toolchain/clang/bin/clang" --version
          "${GITHUB_WORKSPACE}/toolchain/clang/bin/ld.lld" --version

      - name: Configure and build GKI kernel
        id: build
        working-directory: kernel_platform/common
        env:
          KSU_VARIANT: ${{ inputs.ksu_variant || 'official' }}
          KSU_REF: ${{ inputs.ksu_ref || '' }}
          ENABLE_SUSFS: ${{ (github.event_name == 'workflow_dispatch' && !inputs.enable_susfs) && 'false' || 'true' }}
          SUSFS_REF: ${{ inputs.susfs_ref || '784ac9e6' }}
          LTO_MODE: ${{ inputs.lto || 'full' }}
          KERNEL_SUFFIX: ${{ inputs.kernel_suffix || '' }}
          BUILD_IMAGE_LZ4: ${{ inputs.build_image_lz4 || false }}
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/toolchain/clang/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=android-build
          export KBUILD_BUILD_HOST=github-actions

          # Save GKI KMI-compliant scmversion BEFORE KernelSU modifies drivers/Makefile & drivers/Kconfig
          # so -dirty is not appended to kernelrelease.
          rm -f .scmversion
          ./scripts/setlocalversion --save-scmversion . android12-5.10 9
          if [ -n "${KERNEL_SUFFIX}" ]; then
            printf '%s' "${KERNEL_SUFFIX}" >> .scmversion
          fi
          echo "SCMVERSION=$(cat .scmversion)"

          # Integrate KernelSU and optional SUSFS
          KSU_TAG=""
          if [ "${KSU_VARIANT}" = "none" ]; then
            ENABLE_SUSFS="false"
          elif [ "${KSU_VARIANT}" = "next" ] && [ "${ENABLE_SUSFS}" = "true" ]; then
            echo "ERROR: enable_susfs=true in this workflow uses simonpunk/susfs4ksu 10_enable_susfs_for_ksu.patch which targets official tiann/KernelSU (ksu_variant=official). Set ksu_variant=official or enable_susfs=false."
            exit 1
          elif [ "${KSU_VARIANT}" = "official" ]; then
            echo "Integrating official tiann/KernelSU..."
            if [ "${ENABLE_SUSFS}" = "true" ] && [ -z "${KSU_REF}" ]; then
              KSU_REF="2a60b28"
            fi
            if [ -n "${KSU_REF}" ]; then
              curl -fsSL "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${KSU_REF}"
            else
              curl -fsSL "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s
            fi
            echo "KernelSU HEAD: $(git -C KernelSU rev-parse --short HEAD)"
            if [ "${ENABLE_SUSFS}" = "true" ]; then
              echo "Applying SUSFS KernelSU patch (${SUSFS_REF})..."
              rm -rf "${GITHUB_WORKSPACE}/susfs4ksu"
              git clone --single-branch --branch gki-android12-5.10 \
                https://gitlab.com/simonpunk/susfs4ksu.git \
                "${GITHUB_WORKSPACE}/susfs4ksu"
              git -C "${GITHUB_WORKSPACE}/susfs4ksu" checkout "${SUSFS_REF}"
              git -C KernelSU apply "${GITHUB_WORKSPACE}/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
              KSU_TAG="KSU-SUSFS"
            else
              KSU_TAG="KSU"
            fi
          elif [ "${KSU_VARIANT}" = "next" ]; then
            echo "Integrating KernelSU-Next..."
            if [ -n "${KSU_REF}" ]; then
              curl -fsSL "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s "${KSU_REF}"
            else
              curl -fsSL "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s
            fi
            KSU_TAG="KSUN"
          fi
          echo "ksu_tag=${KSU_TAG}" >> "${GITHUB_OUTPUT}"
          echo "enable_susfs=${ENABLE_SUSFS}" >> "${GITHUB_OUTPUT}"

          MAKE_ARGS=(
            -j"$(nproc)"
            O=out
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__"
          )

          make "${MAKE_ARGS[@]}" gki_defconfig

          if [ "${KSU_VARIANT}" != "none" ]; then
            ./scripts/config --file out/.config -e KSU
            if [ "${ENABLE_SUSFS}" = "true" ]; then
              ./scripts/config --file out/.config \
                -e KSU_SUSFS \
                -e KSU_SUSFS_SUS_PATH \
                -e KSU_SUSFS_SUS_MOUNT \
                -e KSU_SUSFS_SUS_KSTAT \
                -e KSU_SUSFS_SPOOF_UNAME \
                -e KSU_SUSFS_ENABLE_LOG \
                -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                -e KSU_SUSFS_OPEN_REDIRECT \
                -e KSU_SUSFS_SUS_MAP \
                -e KSU_SUSFS_PRIORITY_UID_FILTER
            else
              ./scripts/config --file out/.config -d KSU_SUSFS
            fi
          fi

          case "${LTO_MODE}" in
            full)
              ./scripts/config --file out/.config \
                -e LTO_CLANG_FULL \
                -d LTO_CLANG_THIN
              ;;
            thin)
              ./scripts/config --file out/.config \
                -d LTO_CLANG_FULL \
                -e LTO_CLANG_THIN
              ;;
            none)
              ./scripts/config --file out/.config \
                -d LTO_CLANG_FULL \
                -d LTO_CLANG_THIN \
                -d CFI_CLANG \
                -d CFI_PERMISSIVE
              ;;
          esac

          make "${MAKE_ARGS[@]}" olddefconfig

          if [ "${KSU_VARIANT}" != "none" ]; then
            grep -q "^CONFIG_KSU=y$" out/.config
            if [ "${ENABLE_SUSFS}" = "true" ]; then
              grep -q "^CONFIG_KSU_SUSFS=y$" out/.config
              grep -q "^CONFIG_KSU_SUSFS_SUS_PATH=y$" out/.config
              grep -q "^CONFIG_KSU_SUSFS_SUS_MOUNT=y$" out/.config
              grep -q "^CONFIG_KSU_SUSFS_SUS_KSTAT=y$" out/.config
              grep -q "^CONFIG_KSU_SUSFS_SPOOF_UNAME=y$" out/.config
              grep -q "^CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y$" out/.config
              grep -q "^CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y$" out/.config
              grep -q "^CONFIG_KSU_SUSFS_OPEN_REDIRECT=y$" out/.config
              grep -q "^CONFIG_KSU_SUSFS_SUS_MAP=y$" out/.config
              grep -q "^CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y$" out/.config
            else
              grep -q "^CONFIG_KPROBES=y$" out/.config
            fi
          fi

          TARGETS=(Image)
          if [ "${BUILD_IMAGE_LZ4}" = "true" ]; then
            TARGETS+=(Image.lz4)
          fi

          make "${MAKE_ARGS[@]}" "${TARGETS[@]}"

          KERNEL_RELEASE="$(cat out/include/config/kernel.release)"
          BUILD_DATE="$(date -u +%Y%m%d-%H%M)"
          echo "kernel_release=${KERNEL_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "build_date=${BUILD_DATE}" >> "${GITHUB_OUTPUT}"

          ls -lh out/arch/arm64/boot/Image*
          file out/arch/arm64/boot/Image

      - name: Package flashable AnyKernel3 ZIP
        id: package
        run: |
          set -euo pipefail
          KERNEL_RELEASE="${{ steps.build.outputs.kernel_release }}"
          BUILD_DATE="${{ steps.build.outputs.build_date }}"
          KSU_TAG="${{ steps.build.outputs.ksu_tag }}"
          if [ -n "${KSU_TAG}" ]; then
            ZIP_NAME="AnyKernel3-RealmeGT2Pro-${KSU_TAG}-${KERNEL_RELEASE}-${BUILD_DATE}.zip"
            KERNEL_STR="Realme GT 2 Pro ${KSU_TAG} (${KERNEL_RELEASE})"
          else
            ZIP_NAME="AnyKernel3-RealmeGT2Pro-${KERNEL_RELEASE}-${BUILD_DATE}.zip"
            KERNEL_STR="Realme GT 2 Pro (${KERNEL_RELEASE})"
          fi

          rm -rf ak3-stage release-assets
          mkdir -p release-assets
          cp -r kernel_platform/common/AnyKernel3 ak3-stage
          cp kernel_platform/common/out/arch/arm64/boot/Image ak3-stage/Image
          rm -rf ak3-stage/.git* ak3-stage/README.md
          find ak3-stage -name '*placeholder' -delete

          sed -i "s|^kernel.string=.*|kernel.string=${KERNEL_STR}|" ak3-stage/anykernel.sh

          (
            cd ak3-stage
            zip -r9 "${GITHUB_WORKSPACE}/release-assets/${ZIP_NAME}" .
          )

          echo "zip_name=${ZIP_NAME}" >> "${GITHUB_OUTPUT}"
          echo "zip_path=${GITHUB_WORKSPACE}/release-assets/${ZIP_NAME}" >> "${GITHUB_OUTPUT}"

          ls -lh "${GITHUB_WORKSPACE}/release-assets/${ZIP_NAME}"
          sha256sum "${GITHUB_WORKSPACE}/release-assets/${ZIP_NAME}"
          unzip -l "${GITHUB_WORKSPACE}/release-assets/${ZIP_NAME}"

      - name: Upload AnyKernel3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-RealmeGT2Pro-${{ steps.build.outputs.ksu_tag || 'Stock' }}-${{ steps.build.outputs.kernel_release }}-${{ steps.build.outputs.build_date }}
          path: ak3-stage
          retention-days: 30
          if-no-files-found: error

      - name: Upload raw kernel Image artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-${{ steps.build.outputs.build_date }}
          path: |
            kernel_platform/common/out/arch/arm64/boot/Image
            kernel_platform/common/out/arch/arm64/boot/Image.lz4
          retention-days: 14
          if-no-files-found: error

      - name: Package SUSFS KernelSU module ZIP
        id: package-susfs
        if: steps.build.outputs.enable_susfs == 'true' && steps.build.outputs.ksu_tag == 'KSU-SUSFS'
        working-directory: susfs4ksu
        run: |
          set -euo pipefail
          bash build_ksu_module.sh
          MODULE_PATH="${GITHUB_WORKSPACE}/susfs4ksu/ksu_module_susfs.zip"
          test -f "${MODULE_PATH}"
          cp "${MODULE_PATH}" "${GITHUB_WORKSPACE}/release-assets/ksu_module_susfs-${{ steps.build.outputs.kernel_release }}.zip"
          echo "module_path=${GITHUB_WORKSPACE}/release-assets/ksu_module_susfs-${{ steps.build.outputs.kernel_release }}.zip" >> "${GITHUB_OUTPUT}"
          ls -lh "${MODULE_PATH}"
          sha256sum "${MODULE_PATH}"
          unzip -l "${MODULE_PATH}"

      - name: Upload SUSFS KernelSU module artifact
        if: steps.build.outputs.enable_susfs == 'true' && steps.build.outputs.ksu_tag == 'KSU-SUSFS'
        uses: actions/upload-artifact@v4
        with:
          name: susfs4ksu-module-${{ steps.build.outputs.build_date }}
          path: susfs4ksu/ksu_module_susfs
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ steps.build.outputs.build_date }}
          name: Realme GT 2 Pro Kernel ${{ steps.build.outputs.kernel_release }}
          body: |
            - **Device:** Realme GT 2 Pro / SM8450 (GKI 5.10 LTS)
            - **Kernel Release:** `${{ steps.build.outputs.kernel_release }}`
            - **SUSFS:** `${{ steps.build.outputs.enable_susfs }}`
            - **LTO:** `${{ inputs.lto || 'full' }}`
            - **Commit:** `${{ github.sha }}`
            - **Flashable ZIP:** `${{ steps.package.outputs.zip_name }}`
          files: release-assets/*
